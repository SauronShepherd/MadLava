<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; connect-src 'none'; base-uri 'none'"><title>MadLava Report Viewer</title><link rel="stylesheet" href="viewer.css"></head>
<body><main><h1>MadLava Report Viewer</h1><p class="lead">Open a local MadLava JSONL report. Files stay in this browser and no network service is used.</p><label class="picker">Report file <input id="report-file" type="file" accept=".jsonl,.json,application/json"></label><p id="status" role="status">No report loaded.</p><section id="summary" hidden><h2>Overview</h2><dl><dt>Snapshots</dt><dd id="snapshot-count">0</dd><dt>Agent version</dt><dd id="agent-version">unknown</dd><dt>Last sequence</dt><dd id="last-sequence">0</dd><dt>Final snapshot</dt><dd id="final-state">no</dd></dl><h2>Feature health</h2><table><thead><tr><th>Feature</th><th>State</th><th>Accuracy</th></tr></thead><tbody id="features"></tbody></table><h2>Raw final snapshot</h2><pre id="raw"></pre></section></main><script src="viewer.js"></script></body></html>
