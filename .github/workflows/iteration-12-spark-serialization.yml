name: Iteration-12 Spark serialization

on:
  push:
    branches: [Iteration-12]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify

  spark-integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: spark35-it
            java: '11'
            spark: '3.5.9'
            scala: '2.12'
          - profile: spark35-it
            java: '17'
            spark: '3.5.9'
            scala: '2.12'
          - profile: spark35-scala213-it
            java: '11'
            spark: '3.5.9'
            scala: '2.13'
          - profile: spark35-scala213-it
            java: '17'
            spark: '3.5.9'
            scala: '2.13'
          - profile: spark40-it
            java: '17'
            spark: '4.0.4'
            scala: '2.13'
          - profile: spark40-it
            java: '21'
            spark: '4.0.4'
            scala: '2.13'
          - profile: spark41-it
            java: '17'
            spark: '4.1.3'
            scala: '2.13'
          - profile: spark41-it
            java: '21'
            spark: '4.1.3'
            scala: '2.13'
          - profile: spark42-it
            java: '17'
            spark: '4.2.0'
            scala: '2.13'
          - profile: spark42-it
            java: '21'
            spark: '4.2.0'
            scala: '2.13'
    runs-on: ubuntu-latest
    name: Spark ${{ matrix.spark }} / Scala ${{ matrix.scala }} / Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -P${{ matrix.profile }} clean verify
