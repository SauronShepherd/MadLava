name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        run: mvn -B -Pgeneric clean verify -Drevision=0.1.0
      - name: Verify offline report viewer contract
        shell: pwsh
        run: |
          ./scripts/verify-viewer.ps1
          ./scripts/verify-viewer-time-filter.ps1
